name: Main PR Policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$HEAD_REF" != "dev" ]; then
            echo "PRs to main must come from this repository's dev branch; got $HEAD_REPO:$HEAD_REF."
            exit 1
          fi
