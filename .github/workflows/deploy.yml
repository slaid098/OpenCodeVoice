name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Knip
        run: npm run knip

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Deploy to dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          cd dist
          git init -b dist
          git config user.name "forgejo-actions"
          git config user.email "actions@noreply.git.slaid098.dev"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7}"

          # GitHub is the primary update host (@updateURL/@downloadURL/@icon).
          # The automatic token is enough for it.
          git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force github dist

          # Forgejo is a mirror. It needs a PAT with write:repository stored as
          # the FORGEJO_TOKEN secret; without it the job warns instead of
          # failing the whole CI run.
          if [ -n "${FORGEJO_TOKEN}" ]; then
            git remote add forgejo "https://slaid098:${FORGEJO_TOKEN}@git.slaid098.dev/slaid098/opencode-voice-dictation.git"
            git push --force forgejo dist
          else
            echo "::warning::FORGEJO_TOKEN is not set; dist was not published to Forgejo"
          fi