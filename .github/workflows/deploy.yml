name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Knip
        run: npm run knip

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Deploy to dist branch
        run: |
          cd dist
          git init -b dist
          git config user.name "forgejo-actions"
          git config user.email "actions@noreply.git.slaid098.dev"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git remote add origin "https://${GITHUB_TOKEN}@git.slaid098.dev/slaid098/opencode-voice-dictation.git"
          git push --force origin dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}