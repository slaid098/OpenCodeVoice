<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="halo" cx="512" cy="470" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B6FF3C" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#B6FF3C" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#B6FF3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#050607"/>
  <circle cx="512" cy="470" r="360" fill="url(#halo)"/>

  <!-- subtle OpenCode-style brackets -->
  <g fill="none" stroke="#263317" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 300 H258 V700 H330"/>
    <path d="M694 300 H766 V700 H694"/>
  </g>

  <!-- microphone glow -->
  <g filter="url(#glow)" opacity="0.45">
    <rect x="452" y="300" width="120" height="240" rx="60" fill="#B6FF3C"/>
    <path d="M392 486 v24 a120 120 0 0 0 240 0 v-24" fill="none" stroke="#B6FF3C" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- microphone -->
  <g fill="none" stroke="#B6FF3C" stroke-width="18" stroke-linecap="round">
    <rect x="452" y="300" width="120" height="240" rx="60" fill="#B6FF3C" stroke="none"/>
    <path d="M392 486 v24 a120 120 0 0 0 240 0 v-24"/>
    <path d="M512 630 V700"/>
    <path d="M458 700 H566"/>
  </g>

  <text x="512" y="816" text-anchor="middle" fill="#FFFFFF"
        font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="94" font-weight="600" letter-spacing="-1">OpenCode</text>
  <text x="512" y="916" text-anchor="middle" fill="#B6FF3C"
        font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="94" font-weight="600" letter-spacing="-1">Voice</text>
  <text x="512" y="970" text-anchor="middle" fill="#7E915F"
        font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="500" letter-spacing="11">DICTATION FOR THE WEB</text>
</svg>
